# Local development infrastructure only (Postgres + Redis).
# Usage: docker compose -f docker-compose.dev.yml up -d
# Host ports can be overridden with POSTGRES_PORT / REDIS_PORT if 5432/6379 are taken.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iziphone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iziphone123}
      POSTGRES_DB: ${POSTGRES_DB:-iziphone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iziphone} -d ${POSTGRES_DB:-iziphone}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
